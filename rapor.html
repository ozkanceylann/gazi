<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raporlar</title>

  <!-- CONFIG -->
  <script src="config.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=20261011-dashboard-2" />

  <!-- SUPABASE & CHARTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .report-card{
      background:#fff;padding:20px;border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.12);flex:1;min-width:220px
    }
    .report-card h3{margin:0;font-size:16px}
    .report-card .value{margin-top:8px;font-size:24px;font-weight:700}
    .toolbar{
      background:#fff;padding:16px;border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
      margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;
      align-items:center
    }
    select, input[type="date"]{
      padding:10px;border:1px solid #ccc;border-radius:8px
    }
  </style>
</head>
<body class="orders-page">
  <button class="mobile-menu-btn" onclick="toggleMenu()" aria-label="Menüyü aç veya kapat">☰</button>

  <aside class="sidebar">
    <div class="sidebar-header">
      <img id="brandLogo" class="sidebar-logo" alt="Logo">
      <div id="brandTitle" class="sidebar-title"></div>
    </div>

    <ul class="menu">
      <li onclick="window.location='index.html?tab=bekleyen'">Bekleyen</li>
      <li onclick="window.location='index.html?tab=hazirlandi'">Hazırlandı</li>
      <li onclick="window.location='index.html?tab=kargolandi'">Kargolandı</li>
      <li onclick="window.location='index.html?tab=tamamlandi'">Tamamlananlar</li>
      <li onclick="window.location='index.html?tab=sorunlu'">Sorunlu</li>
      <li onclick="window.location='index.html?tab=iptal'">İptal</li>
      <li class="active">Raporlar</li>
    </ul>

    <button class="btn-danger" onclick="reportLogout()">Çıkış Yap</button>
  </aside>

  <div class="content-area">

    <header class="page-header"><div><p class="page-eyebrow">SİPARİŞ YÖNETİMİ</p><h1>Raporlar</h1></div></header><p id="reportStatus" role="status" aria-live="polite"></p>

    <!-- FİLTRE ARAÇLARI -->
    <div class="toolbar">
      <label><b>Başlangıç:</b></label><input type="date" id="startDate"/>
      <label><b>Bitiş:</b></label><input type="date" id="endDate"/>

      <label><b>Durum:</b></label>
      <select id="statusSel">
        <option value="">Hepsi</option>
        <option>Bekliyor</option>
        <option>Hazırlandı</option>
        <option>Kargolandı</option>
        <option>Tamamlandı</option>
        <option>Sorunlu</option>
        <option>İptal</option>
      </select>

      <button class="btn-primary" onclick="loadReport()">Raporla</button>
      <button class="btn-secondary" onclick="exportExcel()">Excel İndir</button>
      <button class="btn-close" onclick="window.location='index.html'">Geri</button>
    </div>

    <div id="summaryCards" style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;"></div>

    <div style="background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:20px;">
      <h3>📈 Günlük Sipariş</h3>
      <canvas id="dailyChart" style="max-height:300px;"></canvas>
    </div>

    <div style="background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:20px;">
      <h3>📞 Sipariş Alan</h3>
      <canvas id="salesByTel" style="max-height:300px;"></canvas>
    </div>

    <div class="table-wrapper">
      <table class="orders-table">
        <thead>
          <tr>
            <th>No</th>
            <th>İsim</th>
            <th>Tutar</th>
            <th>Durum</th>
            <th>Tarih</th>
            <th>Sipariş Alan</th>
          </tr>
        </thead>
        <tbody id="reportTable"></tbody>
      </table>
    </div>
  </div>



<div id="orderModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reportDetailTitle"><div class="modal-content"><h2 id="reportDetailTitle">Sipariş Detayı</h2><div id="orderDetails"></div><div class="modal-btns"><button id="reportDetailClose" class="btn-close" onclick="closeReportDetail()">Kapat</button></div></div></div>
<!-- ===================== -->
<!--   RAPOR SCRIPTİ       -->
<!-- ===================== -->
<script>
(async ()=>{
  await window.waitConfig();

  document.getElementById("brandLogo").src = CONFIG.logo;
  document.getElementById("brandTitle").innerHTML = CONFIG.brandName + "<br/>Sipariş Sistemi";

  const TABLE = CONFIG.table;
  const db = supabase.createClient(
    "https://jarsxtpqzqzhlshpmgot.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphcnN4dHBxenF6aGxzaHBtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODExMTcsImV4cCI6MjA3Nzg1NzExN30.98oYONSkb8XSDrfGW2FxhFmt2BLB5ZRo3Ho50GhZYgE"
  );

  await window.requireSession(db);
  let chart1=null, chart2=null;
  let reportRequest = 0;
  let lastRows=[];

  function escapeReport(value) { return String(value??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
  function parseAmount(value) {
    let text=String(value??"").replace(/[^0-9,.-]/g,"");
    if(text.includes(","))text=text.replace(/\./g,"").replace(",",".");
    else if(/^\d{1,3}(\.\d{3})+$/.test(text))text=text.replace(/\./g,"");
    const amount=Number(text); return Number.isFinite(amount)?amount:0;
  }
  let detailTrigger=null;
  function closeReportDetail(){
    document.getElementById("orderModal").style.display="none";
    detailTrigger?.focus();
  }
  function openReportDetail(orderNo,trigger) {
    const order=lastRows.find(row=>Number(row.siparis_no)===Number(orderNo));
    if(!order)return;
    detailTrigger=trigger;
    const root=document.getElementById("orderDetails");root.replaceChildren();
    const grid=document.createElement("div");grid.className="report-detail-grid";
    const groups=[
      ["Müşteri ve İletişim",[["İsim","ad_soyad"],["Müşteri No","musteri_no"],["Telefon","musteri_tel"]]],
      ["Sipariş Bilgileri",[["Sipariş No","siparis_no"],["Sipariş Alan","siparis_alan"],["Sipariş Telefonu","siparis_tel"],["Tarih","tarih"],["Durum","kargo_durumu"]]],
      ["Adres",[["Adres","adres"],["Şehir","sehir"],["İlçe","ilce"]]],
      ["Ürün ve Ödeme",[["Ürün","urun_bilgisi"],["Kargo Adedi","kargo_adet"],["KG","kargo_kg"],["Tutar","toplam_tutar"],["Ödeme","odeme_sekli"],["Kargo Kodu","kargo_takip_kodu"]]],
      ["Not",[["","notlar"]]]
    ];
    for(const [title,fields] of groups){
      const group=document.createElement("section");group.className="detail-group"+(title==="Not"?" full-row":"");
      const heading=document.createElement("div");heading.className="detail-title";heading.textContent=title;group.append(heading);
      for(const [label,key] of fields) {
        const row=document.createElement("div");row.className="detail-item";
        const b=document.createElement("b");b.textContent=label?label+": ":"";
        row.append(b,document.createTextNode(String(order[key]??"—")));group.append(row);
      }
      grid.append(group);
    }
    root.append(grid);document.getElementById("orderModal").style.display="flex";
    document.getElementById("reportDetailClose").focus();
  }
  document.getElementById("reportTable").addEventListener("click",event=>{
    const button=event.target.closest("[data-order]");if(button)openReportDetail(button.dataset.order,button);
  });
  window.closeReportDetail=closeReportDetail;
  document.getElementById("orderModal").addEventListener("click",event=>{if(event.target.id==="orderModal")closeReportDetail();});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closeReportDetail();});
  window.reportLogout=async ()=>{
    const {error}=await db.auth.signOut({scope:"local"});
    if(error){document.getElementById("reportStatus").textContent="Çıkış yapılamadı. Yeniden deneyin.";return;}
    ["session","firma","rol","print_order"].forEach(key=>localStorage.removeItem(key));
    location.href="login.html";
  };



  /* ==============================
        RAPOR YÜKLEME
  ============================== */

  async function loadReport(){
    const request = ++reportRequest;
    const s = document.getElementById("startDate").value;
    const e = document.getElementById("endDate").value;
    const st = document.getElementById("statusSel").value;
    const status = document.getElementById("reportStatus");
    if (s && e && s > e) { status.textContent = "Başlangıç tarihi bitişten sonra olamaz."; return; }
    status.textContent = "Rapor hazırlanıyor…";
    lastRows = []; renderReport([]);
    try {
      const rows = [], size = 500;
      for (let offset = 0;;offset += size) {
        let q = db.from(TABLE).select("*");
        if(s) q=q.gte("tarih", s);
        if(e) {
          const next = new Date(e+"T12:00:00"); next.setDate(next.getDate()+1);
          q=q.lt("tarih",formatDate(next));
        }
        if(st==="Tamamlandı") q=q.or("shipmentStatusCode.eq.5,isDelivered.eq.true");
        else if(st==="Sorunlu") q=q.in("shipmentStatusCode",[6,7]).eq("isDelivered",false);
        else if(st) q=q.eq("kargo_durumu",st);
        const {data,error}=await q.order("tarih",{ascending:false}).order("siparis_no",{ascending:false}).range(offset,offset+size-1);
        if(request!==reportRequest)return;
        if(error)throw error;
        rows.push(...(data||[]));
        if(!data || data.length<size)break;
      }
      lastRows=rows; renderReport(rows);
      status.textContent=rows.length+" sipariş · Müşteri adına tıklayarak ayrıntıları açın.";
    } catch(error) { if(request!==reportRequest)return; console.error(error); status.textContent="Rapor yüklenemedi. Yeniden deneyin."; }
  }


  /* ==============================
        TABLO + ÖZET + GRAFİK
  ============================== */
  function renderReport(rows){
    const table = document.getElementById("reportTable");
    const summary = document.getElementById("summaryCards");
    table.innerHTML=""; summary.innerHTML="";

    if(!rows.length){
      table.innerHTML = `<tr><td colspan="6">Kayıt yok</td></tr>`;
      buildCharts([]);
      return;
    }

    let toplam=0, adet=rows.length, kargolanan=0;
    rows.forEach(r=>{
      toplam += parseAmount(r.toplam_tutar);
      if(r.kargo_durumu==="Kargolandı") kargolanan++;
      table.innerHTML += `
        <tr>
          <td>${r.siparis_no}</td>
          <td><button class="report-customer" data-order="${Number(r.siparis_no)}">${escapeReport(r.ad_soyad)}</button></td>
          <td>${escapeReport(r.toplam_tutar)} TL</td>
          <td>${escapeReport(r.kargo_durumu)}</td>
          <td>${(r.tarih||"").substring(0,10)}</td>
          <td>${escapeReport(r.siparis_alan||"")}</td>
        </tr>`;
    });

    summary.innerHTML = `
      <div class="report-card"><h3>Toplam Sipariş</h3><div class="value">${adet}</div></div>
      <div class="report-card"><h3>Toplam Tutar</h3><div class="value">${toplam.toLocaleString("tr-TR")} TL</div></div>
      <div class="report-card"><h3>Kargolanan</h3><div class="value">${kargolanan}</div></div>
    `;

    buildCharts(rows);
  }


  /* ==============================
        GRAFİKLER
  ============================== */
  function buildCharts(rows){
    const daily={};
    rows.forEach(r=>{
      const d=(r.tarih||"").substring(0,10);
      daily[d]=(daily[d]||0)+1;
    });

    const labels1=Object.keys(daily).sort();
    const values1=labels1.map(day=>daily[day]);

    if(chart1) chart1.destroy();
    chart1 = new Chart(document.getElementById("dailyChart"),{
      type:"line",
      data:{
        labels:labels1,
        datasets:[{ label:"Günlük Sipariş", data:values1, borderWidth:3 }]
      }
    });

    const byTel={};
    rows.forEach(r=>{
      const key=r.siparis_alan||"Bilinmiyor";
      byTel[key]=(byTel[key]||0)+1;
    });

    const labels2=Object.keys(byTel);
    const values2=Object.values(byTel);

    if(chart2) chart2.destroy();
    chart2 = new Chart(document.getElementById("salesByTel"),{
      type:"bar",
      data:{
        labels:labels2,
        datasets:[{ label:"Sipariş Sayısı", data:values2, borderWidth:2 }]
      }
    });
  }


  /* ==============================
        EXCEL EXPORT
  ============================== */
  function exportExcel(){
    if(!lastRows.length){ alert("Dışa aktarılacak veri yok"); return; }

    const headers = ["No","İsim","Tutar","Durum","Tarih","Sipariş Alan"];

    const rows = lastRows.map(r=>[
      r.siparis_no, r.ad_soyad, r.toplam_tutar,
      r.kargo_durumu, (r.tarih||"").substring(0,19),
      r.siparis_alan||""
    ]);

    const tableHtml = `
      <table>
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>
          ${rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeReport(cell)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    `;

    const blob = new Blob(["\ufeff" + tableHtml], { type:"application/vnd.ms-excel" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rapor.xls";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }


/* ============================== 
   GLOBAL EXPORT
============================== */
window.loadReport = loadReport;
window.exportExcel = exportExcel;


/* ==============================
   BAŞLANGIÇTA BU AYIN RAPORU
============================== */

function formatDate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

const today = new Date();

// Bu ayın 1. günü
const firstDay = new Date(
  today.getFullYear(),
  today.getMonth(),
  1
);

// Tarih kutularını otomatik doldur
document.getElementById("startDate").value = formatDate(firstDay);
document.getElementById("endDate").value = formatDate(today);

// Bu ayın raporunu otomatik getir
loadReport();

})();

function toggleMenu(){
  document.querySelector(".sidebar").classList.toggle("open");
}

document.addEventListener("click", e=>{
  const sidebar = document.querySelector(".sidebar");
  const btn = document.querySelector(".mobile-menu-btn");
  if(!sidebar.classList.contains("open")) return;
  if(sidebar.contains(e.target) || btn.contains(e.target)) return;
  sidebar.classList.remove("open");
});
</script>

</body>
</html>
