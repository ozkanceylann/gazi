<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Etiket Yazdır</title>

<style>

/* ==============================
   58 x 40 MM ETİKET
============================== */

@page {
  size: 58mm 40mm;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
}

body {
  position: relative;
  width: 58mm;
  margin: 0;
  padding: 0;

  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.15;

  color: #000;
  overflow: visible;
}

/* ANA ALAN */
#wrap {
  position: absolute;
  top: 2.5mm;
  left: 3mm;
  width: 52.5mm;
  margin: 0;
  padding: 0;

  page-break-inside: avoid;
  break-inside: avoid;
}

/* SATIRLAR */
.row {
  margin: 0 0 0.6mm 0;
  padding: 0;

  word-break: break-word;
  overflow-wrap: break-word;
}

/* VURGULAR */
.bold {
  font-weight: 700;
}

.small {
  font-size: 1em;
}

/* Her bölüm bir dolu etikettir. Son etiketin ardından sayfa kırılmaz. */
.label-page {
  position: relative;
  width: 58mm;
  height: 39.5mm;
  overflow: hidden;
  break-after: page;
  page-break-after: always;
}
.label-page:last-child {
  break-after: auto;
  page-break-after: auto;
}
.label-content {
  position: absolute;
  top: 2.5mm;
  left: 3mm;
  width: 52.5mm;
}
.row { white-space: pre-wrap; }
.separator-before {
  width: 100%;
  max-width: 52.5mm;
  border-top: 1px dashed #000;
  padding-top: 0.5mm;
}
.row:empty { display: none; }

/* ==============================
   YAZDIRMA
============================== */

@media print {

  @page {
    size: 58mm 40mm;
    margin: 0;
  }

  html {
    width: 58mm;
    margin: 0;
    padding: 0;
  }

  body {
    width: 58mm;
    height: auto;
    margin: 0;
    padding: 0;

    overflow: visible;

    page-break-after: avoid !important;
    page-break-before: avoid !important;
  }

  #wrap {
    width: 52.5mm;
    margin: 0;
    padding: 0;

    page-break-before: avoid !important;
    page-break-after: avoid !important;
    page-break-inside: avoid !important;

    break-before: avoid !important;
    break-after: avoid !important;
    break-inside: avoid !important;
  }
}

</style>
</head>

<body>

<div id="wrap">

  <!-- MÜŞTERİ -->
  <div class="row bold" id="musteri"></div>

  <!-- TELEFON -->
  <div class="row" id="telefon"></div>

  <!-- ADRES -->
  <div class="row small" id="adres"></div>

  <!-- AYIRICI -->


  <!-- ÜRÜN -->
  <div class="row separator-before" id="urun"></div>

  <!-- AYIRICI -->


  <!-- ÖDEME -->
  <div class="row small separator-before" id="odeme"></div>

  <!-- TUTAR -->
  <div class="row bold" id="tutar"></div>

</div>


<script>
const batchKey=new URLSearchParams(location.search).get("batch");
if(batchKey){
  window.addEventListener("load",()=>{
    try{
      if(!/^prepare_batch_[a-zA-Z0-9_]+$/.test(batchKey))throw Error("Etiket kaydı geçersiz.");
      const orders=JSON.parse(localStorage.getItem(batchKey)||"null");
      if(!Array.isArray(orders)||orders.length<1||orders.length>10)throw Error("Toplu etiket kaydı bulunamadı.");
      for(const order of orders){
        const count=Number(order.kargo_adet);
        if(!Number.isSafeInteger(count)||count<1||count>100)throw Error("Kargo adedi geçersiz.");
      }
      const template=document.getElementById("wrap");
      const pages=document.createDocumentFragment();
      for(const order of orders){
        const content=template.cloneNode(true);
        const set=(id,value)=>content.querySelector("#"+id).textContent=value||"";
        set("musteri",order.ad_soyad);
        set("telefon",order.musteri_tel?"Tel: "+order.musteri_tel:"");
        const address=[order.adres,[order.ilce,order.sehir].filter(Boolean).join(" / ")].filter(Boolean).join(" - ");
        set("adres",address?"Adres: "+address:"");
        set("urun",order.urun_bilgisi);
        set("odeme",order.odeme_sekli?"Ödeme: "+order.odeme_sekli:"");
        set("tutar",order.toplam_tutar?"Tutar: "+order.toplam_tutar+" TL":"");
        content.removeAttribute("id");content.className="label-content";
        content.querySelectorAll("[id]").forEach(node=>node.removeAttribute("id"));
        for(let i=0;i<Number(order.kargo_adet);i++){
          const page=document.createElement("section");page.className="label-page";
          page.appendChild(content.cloneNode(true));pages.appendChild(page);
        }
      }
      template.remove();document.body.appendChild(pages);
      document.querySelectorAll(".label-content").forEach(content=>{
        let size=12;content.style.fontSize=size+"px";
        while(content.getBoundingClientRect().height>34.5*96/25.4&&size>6){size-=0.25;content.style.fontSize=size+"px";}
      });
      document.title=orders.length+" Sipariş · Etiket Yazdır";
      setTimeout(()=>window.print(),300);
    }catch(error){document.body.textContent=error.message||"Etiketler açılamadı.";}
  });
}else{


/* =================================
   SİPARİŞ VERİSİNİ AL
================================= */

let data = {};

try {
  data = JSON.parse(
    (new URLSearchParams(location.search).has("order") ? localStorage.getItem("prepare_print_" + new URLSearchParams(location.search).get("order")) : localStorage.getItem("print_order")) || "{}"
  );
} catch (e) {
  data = {};
}


/* =================================
   MÜŞTERİ
================================= */

document.getElementById("musteri").innerText =
  data.ad_soyad || "";


/* =================================
   TELEFON
================================= */

document.getElementById("telefon").innerText =
  data.musteri_tel
    ? "Tel: " + data.musteri_tel
    : "";


/* =================================
   ADRES
================================= */

let fullAddress = data.adres || "";

if (data.ilce || data.sehir) {

  const cityLine =
    [data.ilce, data.sehir]
      .filter(Boolean)
      .join(" / ");

  fullAddress = fullAddress
    ? fullAddress + " - " + cityLine
    : cityLine;
}

document.getElementById("adres").innerText =
  fullAddress
    ? "Adres: " + fullAddress
    : "";


/* =================================
   ÜRÜN
================================= */

document.getElementById("urun").innerText =
  data.urun_bilgisi || "";


/* =================================
   ÖDEME
================================= */

document.getElementById("odeme").innerText =
  data.odeme_sekli
    ? "Ödeme: " + data.odeme_sekli
    : "";


/* =================================
   TUTAR
================================= */

document.getElementById("tutar").innerText =
  data.toplam_tutar
    ? "Tutar: " + data.toplam_tutar + " TL"
    : "";


/* =================================
   YAZDIR
================================= */

/*
   window.close() KULLANILMIYOR.
   Bazı Chrome + etiket yazıcısı
   kombinasyonlarında boş ikinci
   sayfaya sebep olabiliyor.
*/

window.addEventListener("load", function () {

  setTimeout(function () {

    // Fit using native font sizes; never scale the whole printed label.
    const wrap = document.getElementById("wrap");
    const rows = Array.from(wrap.querySelectorAll(".row"))
      .filter(row => row.textContent.trim());
    const availableHeight = 34.5 * 96 / 25.4;
    let fontSize = 12;
    wrap.style.fontSize = fontSize + "px";
    while (wrap.getBoundingClientRect().height > availableHeight && fontSize > 6) {
      fontSize -= 0.25;
      wrap.style.fontSize = fontSize + "px";
    }
    const automatic = new URLSearchParams(location.search).has("order");
    if (automatic) {
      const count = Number(data.kargo_adet);
      if (!Number.isSafeInteger(count) || count < 1 || count > 100) {
        alert("Kargo adedi geçersiz."); return;
      }
      // Each package gets one complete copy of the established order label.
      wrap.remove();
      for (let i = 0; i < count; i++) {
        const page = document.createElement("section");
        page.className = "label-page";
        const content = wrap.cloneNode(true);
        content.removeAttribute("id");
        content.className = "label-content";
        content.querySelectorAll("[id]").forEach(node => node.removeAttribute("id"));
        page.appendChild(content);
        document.body.appendChild(page);
      }
    } else {
      wrap.style.position = "relative";
    }
    window.print();

  }, 300);

});


}
</script>

</body>
</html>
