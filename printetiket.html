<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Etiket Yazdır</title>

<style>

/* ==============================
   58 x 40 MM ETİKET
============================== */

@page {
  size: 58mm 40mm;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
}

body {
  position: relative;
  width: 58mm;
  height: 39.5mm;
  margin: 0;
  padding: 0;

  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.15;

  color: #000;
  overflow: hidden;
}

/* ANA ALAN */
#wrap {
  position: absolute;
  top: 2.5mm;
  left: 5mm;
  width: 50.5mm;
  margin: 0;
  padding: 0;

  page-break-inside: avoid;
  break-inside: avoid;
}

/* SATIRLAR */
.row {
  margin: 0 0 0.6mm 0;
  padding: 0;

  word-break: break-word;
  overflow-wrap: break-word;
}

/* VURGULAR */
.bold {
  font-weight: 700;
}

.small {
  font-size: 0.9em;
}

/* AYIRICI */
.sep {
  border-top: 1px dashed #000;
  height: 0;
  margin: 0.8mm 0;
  padding: 0;
}

/* ==============================
   YAZDIRMA
============================== */

@media print {

  @page {
    size: 58mm 40mm;
    margin: 0;
  }

  html {
    width: 58mm;
    margin: 0;
    padding: 0;
  }

  body {
    width: 58mm;
    height: 39.5mm;
    margin: 0;
    padding: 0;

    overflow: hidden;

    page-break-after: avoid !important;
    page-break-before: avoid !important;
  }

  #wrap {
    width: 50.5mm;
    margin: 0;
    padding: 0;

    page-break-before: avoid !important;
    page-break-after: avoid !important;
    page-break-inside: avoid !important;

    break-before: avoid !important;
    break-after: avoid !important;
    break-inside: avoid !important;
  }
}

</style>
</head>

<body>

<div id="wrap">

  <!-- MÜŞTERİ -->
  <div class="row bold" id="musteri"></div>

  <!-- TELEFON -->
  <div class="row" id="telefon"></div>

  <!-- ADRES -->
  <div class="row small" id="adres"></div>

  <!-- AYIRICI -->
  <div class="sep"></div>

  <!-- ÜRÜN -->
  <div class="row" id="urun"></div>

  <!-- AYIRICI -->
  <div class="sep"></div>

  <!-- ÖDEME -->
  <div class="row small" id="odeme"></div>

  <!-- TUTAR -->
  <div class="row bold" id="tutar"></div>

</div>


<script>

/* =================================
   SİPARİŞ VERİSİNİ AL
================================= */

let data = {};

try {
  data = JSON.parse(
    localStorage.getItem("print_order") || "{}"
  );
} catch (e) {
  data = {};
}


/* =================================
   MÜŞTERİ
================================= */

document.getElementById("musteri").innerText =
  data.ad_soyad || "";


/* =================================
   TELEFON
================================= */

document.getElementById("telefon").innerText =
  data.musteri_tel
    ? "Tel: " + data.musteri_tel
    : "";


/* =================================
   ADRES
================================= */

let fullAddress = data.adres || "";

if (data.ilce || data.sehir) {

  const cityLine =
    [data.ilce, data.sehir]
      .filter(Boolean)
      .join(" / ");

  fullAddress = fullAddress
    ? fullAddress + " - " + cityLine
    : cityLine;
}

document.getElementById("adres").innerText =
  fullAddress
    ? "Adres: " + fullAddress
    : "";


/* =================================
   ÜRÜN
================================= */

document.getElementById("urun").innerText =
  data.urun_bilgisi || "";


/* =================================
   ÖDEME
================================= */

document.getElementById("odeme").innerText =
  data.odeme_sekli
    ? "Ödeme: " + data.odeme_sekli
    : "";


/* =================================
   TUTAR
================================= */

document.getElementById("tutar").innerText =
  data.toplam_tutar
    ? "Tutar: " + data.toplam_tutar + " TL"
    : "";


/* =================================
   YAZDIR
================================= */

/*
   window.close() KULLANILMIYOR.
   Bazı Chrome + etiket yazıcısı
   kombinasyonlarında boş ikinci
   sayfaya sebep olabiliyor.
*/

window.addEventListener("load", function () {

  setTimeout(function () {

    // Resize the text itself; do not transform the label into scaled artwork.
    const wrap = document.getElementById("wrap");
    const availableHeight = 34.5 * 96 / 25.4;
    const availableWidth = 50.5 * 96 / 25.4;
    let fontSize = 10;
    wrap.style.fontSize = fontSize + "px";
    while (
      (wrap.scrollHeight > availableHeight || wrap.scrollWidth > availableWidth) &&
      fontSize > 1
    ) {
      fontSize -= 0.25;
      wrap.style.fontSize = fontSize + "px";
    }
    window.print();

  }, 300);

});

</script>

</body>
</html>
