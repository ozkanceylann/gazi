name: Mobile navigation checks
on:
  push:
    paths: ["mobile-navigation.js", "style.css", "index.html", "rapor.html", "tests/mobile-navigation-browser.cjs", ".github/workflows/mobile-navigation.yml"]
  pull_request:
    paths: ["mobile-navigation.js", "style.css", "index.html", "rapor.html", "tests/mobile-navigation-browser.cjs", ".github/workflows/mobile-navigation.yml"]
permissions:
  contents: read
jobs:
  mobile-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/mobile-navigation-browser.cjs
